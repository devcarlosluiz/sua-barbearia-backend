name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: suabarbearia
          POSTGRES_USER: suabarbearia
          POSTGRES_PASSWORD: suabarbearia
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U suabarbearia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      SECRET_KEY: ci-secret-key-not-used-in-production
      DEBUG: "False"
      DATABASE_NAME: suabarbearia
      DATABASE_USER: suabarbearia
      DATABASE_PASSWORD: suabarbearia
      DATABASE_HOST: localhost
      DATABASE_PORT: "5432"
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Instalar dependências
        run: pip install -r requirements/dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Formatação (ruff format)
        run: ruff format --check .

      - name: Checagens do Django
        run: python manage.py check --deploy --fail-level ERROR

      - name: Verificar migrations pendentes
        run: python manage.py makemigrations --check --dry-run

      - name: Testes
        run: pytest --cov=apps --cov-report=term-missing --cov-report=xml

      - name: Gerar schema OpenAPI
        run: python manage.py spectacular --fail-on-warn --file schema.yml || python manage.py spectacular --file schema.yml

      - uses: actions/upload-artifact@v4
        with:
          name: openapi-schema
          path: schema.yml

  docker:
    name: Imagem de produção
    runs-on: ubuntu-latest
    needs: [backend]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build da imagem do backend
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: false
          tags: sua-barbearia/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
