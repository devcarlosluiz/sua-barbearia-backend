# Sobreposição de produção.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d
#
# Os `-f` explícitos são o que impede o Compose de carregar o
# docker-compose.override.yml: é assim que produção fica sem as portas do
# Postgres/Redis publicadas no host e sem o código-fonte montado por cima da
# imagem. Rodar `docker compose up` sem os `-f` numa VM sobe o stack de
# desenvolvimento.
#
# Usa o estágio `production` do Dockerfile (Gunicorn + WhiteNoise), ativa
# config.settings.prod e sobe o Nginx como proxy reverso com TLS.
#
# Passo a passo completo da VM em docs/DEPLOY.md.

services:
  postgres:
    restart: always

  redis:
    restart: always

  backend:
    build:
      target: production
    # NÃO indente as linhas abaixo para "alinhar": o `>` do YAML só junta
    # linhas que estão no MESMO nível de indentação. Uma linha mais indentada
    # mantém a quebra, e aí `--bind`, `--workers` etc. viram comandos soltos
    # (`sh: 4: --bind: not found`) e o gunicorn sobe sem argumento algum,
    # ouvindo em 127.0.0.1 — onde o nginx não alcança.
    #
    # O `exec` faz o gunicorn virar PID 1 e receber o SIGTERM do `docker stop`,
    # em vez de o shell segurar o sinal e o container morrer no timeout.
    command: >
      sh -c "python manage.py migrate --noinput &&
      python manage.py collectstatic --noinput &&
      exec gunicorn config.wsgi:application
      --bind 0.0.0.0:8000
      --workers ${GUNICORN_WORKERS:-4}
      --timeout 60
      --access-logfile -
      --error-logfile -"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DEBUG: "False"
    restart: always

  celery:
    build:
      target: production
    command: celery -A config worker -l warning --concurrency=${CELERY_CONCURRENCY:-4}
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DEBUG: "False"
    restart: always

  celery-beat:
    build:
      target: production
    command: celery -A config beat -l warning --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DEBUG: "False"
    restart: always

  nginx:
    image: nginx:1.27-alpine
    container_name: suabarbearia_nginx
    restart: always
    environment:
      # Único lugar que define o domínio do nginx. Vem do .env.
      # Aspas obrigatórias: a mensagem tem ": ", que sem elas o YAML leria
      # como início de um mapeamento.
      DOMAIN: "${DOMAIN:?defina DOMAIN no .env, por exemplo DOMAIN=clmlabs.com.br}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/prod.conf.template:/etc/nginx/templates/default.conf.template:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
      - media_data:/var/www/media:ro
      - static_data:/var/www/static:ro
    # 1) envsubst só com '$$DOMAIN' na lista: as variáveis do nginx ($$host,
    #    $$scheme...) precisam sobreviver, e sem a lista o envsubst comeria
    #    todas, gerando uma config silenciosamente quebrada.
    # 2) O laço recarrega a cada 6h para pegar o certificado renovado.
    #
    # Indentação uniforme obrigatória: o `>` do YAML preserva a quebra de
    # linhas mais indentadas e o comando sairia picado em vários.
    command: >
      sh -c "envsubst '$$DOMAIN' < /etc/nginx/templates/default.conf.template
      > /etc/nginx/conf.d/default.conf &&
      { while :; do sleep 6h & wait $${!}; nginx -s reload; done & }
      && nginx -g 'daemon off;'"
    depends_on:
      - backend

  # Renovação automática. A emissão inicial é feita pelo
  # scripts/init_letsencrypt.sh — o certbot só renova quando falta menos de
  # 30 dias, então este laço é barato.
  certbot:
    image: certbot/certbot:latest
    container_name: suabarbearia_certbot
    restart: always
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: >
      sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"

volumes:
  certbot_certs:
  certbot_www:
