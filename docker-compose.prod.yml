# Sobreposição de produção.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d
#
# Usa o estágio `production` do Dockerfile (Gunicorn + WhiteNoise), ativa
# config.settings.prod e sobe o Nginx como proxy reverso.

services:
  postgres:
    ports: []          # o banco não é exposto ao host em produção
    restart: always

  redis:
    ports: []
    restart: always

  backend:
    build:
      target: production
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application
               --bind 0.0.0.0:8000
               --workers ${GUNICORN_WORKERS:-4}
               --timeout 60
               --access-logfile -
               --error-logfile -"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DEBUG: "False"
    ports: []          # o acesso passa pelo Nginx
    restart: always
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles

  celery:
    build:
      target: production
    command: celery -A config worker -l warning --concurrency=${CELERY_CONCURRENCY:-4}
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DEBUG: "False"
    restart: always
    volumes:
      - media_data:/app/media

  celery-beat:
    build:
      target: production
    command: celery -A config beat -l warning --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DEBUG: "False"
    restart: always
    volumes: []

  nginx:
    profiles: []       # em produção o Nginx sempre sobe
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
      - media_data:/var/www/media:ro
      - static_data:/var/www/static:ro
