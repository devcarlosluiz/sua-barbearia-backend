# Base compartilhada entre desenvolvimento e produção.
#
#   cp .env.example .env
#   docker compose up --build -d
#   docker compose exec backend python manage.py seed_data
#
# Este arquivo NÃO publica porta nenhuma no host e não monta o código-fonte.
# Os extras de desenvolvimento (portas, bind mount para hot reload, nginx)
# ficam no docker-compose.override.yml, que o Compose carrega sozinho quando
# você roda `docker compose` sem passar `-f`. Produção usa
# `-f docker-compose.yml -f docker-compose.prod.yml`, que não carrega o
# override e por isso não herda nada de desenvolvimento.
#
# A separação é obrigatória, não estética: o Compose UNE listas como `ports` e
# `volumes` entre arquivos em vez de substituí-las. Um `ports: []` na
# sobreposição de produção é silenciosamente ignorado — foi assim que o
# Postgres e o Redis acabariam publicados na internet numa VM pública.
#
# O app Flutter vive em OUTRO repositório (sua-barbearia-frontend), com o seu próprio
# docker-compose. Os dois stacks são independentes — não compartilham rede: o
# app roda no navegador/celular e chama a API por http://localhost:8000, cujas
# origens já estão liberadas em CORS_ALLOWED_ORIGINS.

name: sua-barbearia-backend

services:
  postgres:
    image: postgres:16-alpine
    container_name: suabarbearia_postgres
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-suabarbearia}
      POSTGRES_USER: ${DATABASE_USER:-suabarbearia}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-suabarbearia}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-suabarbearia} -d ${DATABASE_NAME:-suabarbearia}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: suabarbearia_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: suabarbearia_backend
    # Indentação uniforme, pelo mesmo motivo explicado no docker-compose.prod.yml:
    # o `>` do YAML preserva a quebra de linhas mais indentadas.
    command: >
      sh -c "python manage.py migrate --noinput &&
      exec python manage.py runserver 0.0.0.0:8000"
    env_file:
      - .env
    environment:
      DATABASE_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    # O servidor só passa a atender depois que o `migrate` termina, então este
    # healthcheck é o sinal de "banco migrado" que o celery e o beat esperam.
    #
    # O X-Forwarded-Proto é para produção: com SECURE_SSL_REDIRECT ligado, sem
    # ele o Django devolveria 301 e o curl sairia com 0 mesmo se o banco
    # estivesse fora. ALLOWED_HOSTS precisa conter `localhost` (veja o .env).
    healthcheck:
      test:
        ["CMD", "curl", "-fsS", "-H", "X-Forwarded-Proto: https", "http://localhost:8000/health/"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: suabarbearia_celery
    command: celery -A config worker -l info
    env_file:
      - .env
    environment:
      DATABASE_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    volumes:
      - media_data:/app/media
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: suabarbearia_celery_beat
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file:
      - .env
    environment:
      DATABASE_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  media_data:
  static_data:
