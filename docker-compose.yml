# Stack de desenvolvimento do backend Sua Barbearia.
#
#   cp .env.example .env
#   docker compose up --build -d
#   docker compose exec backend python manage.py seed_data
#
# O app Flutter vive em OUTRO repositório (sua-barbearia-frontend), com o seu próprio
# docker-compose. Os dois stacks são independentes — não compartilham rede: o
# app roda no navegador/celular e chama a API por http://localhost:8000, cujas
# origens já estão liberadas em CORS_ALLOWED_ORIGINS.

name: sua-barbearia-backend

services:
  postgres:
    image: postgres:16-alpine
    container_name: suabarbearia_postgres
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-suabarbearia}
      POSTGRES_USER: ${DATABASE_USER:-suabarbearia}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-suabarbearia}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-suabarbearia} -d ${DATABASE_NAME:-suabarbearia}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: suabarbearia_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: suabarbearia_backend
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    env_file:
      - .env
    environment:
      DATABASE_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    volumes:
      - .:/app
      - media_data:/app/media
      - static_data:/app/staticfiles
    ports:
      - "8000:8000"
    # O runserver só passa a atender depois que o `migrate` termina, então este
    # healthcheck é o sinal de "banco migrado" que o celery e o beat esperam.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: suabarbearia_celery
    command: celery -A config worker -l info
    env_file:
      - .env
    environment:
      DATABASE_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    volumes:
      - .:/app
      - media_data:/app/media
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: suabarbearia_celery_beat
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file:
      - .env
    environment:
      DATABASE_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    volumes:
      - .:/app
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Proxy reverso servindo static/ e media/. Só sobe com `--profile full`;
  # em desenvolvimento o runserver do Django já basta.
  #
  # Publica em 8081, não 8080: a 8080 pertence ao stack do frontend
  # (sua-barbearia-frontend), e com os dois compose independentes um bind duplicado
  # faria o segundo `up` falhar.
  nginx:
    image: nginx:1.27-alpine
    container_name: suabarbearia_nginx
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media_data:/var/www/media:ro
      - static_data:/var/www/static:ro
    ports:
      - "8081:80"
    depends_on:
      - backend
    profiles:
      - full

volumes:
  postgres_data:
  redis_data:
  media_data:
  static_data:
